<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Verification widget</title><link rel="stylesheet" href="style.css"><body style="background:#f6f8f2;padding:20px"><form id="verification"><label for="code">Verification code</label><div class="row" style="flex-wrap:nowrap"><input id="code" placeholder="LAB-2026" required><button>Verify</button></div></form><p id="status" role="status" style="margin-top:15px"></p><script>document.querySelector('form').onsubmit=e=>{e.preventDefault();const ok=document.querySelector('input').value==='LAB-2026';document.querySelector('#status').textContent=ok?'Verification complete':'Invalid code';if(ok)parent.postMessage('verified',location.origin);};</script></body></html>
